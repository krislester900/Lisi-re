name: Build PWA Dist & Android APK/AAB (Lisière)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_android_packages:
        description: 'Packager la PWA en APK et AAB Android (Capacitor)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pwa-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Valider dist/, packager APK/AAB & publier le brouillon de Release
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances (Bun + bun.lock)
        run: bun install --frozen-lockfile || bun install

      - name: Valider les types TypeScript (lint)
        run: bun run lint

      - name: Valider et compiler le build PWA Vite (dist/)
        env:
          VITE_GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bun run build

      - name: Préparer l'archive et les artifacts dist/
        run: |
          mkdir -p release-assets
          (cd dist && zip -r ../release-assets/lisiere-dist.zip .)
          ls -lh release-assets/lisiere-dist.zip

      - name: Publier l'artifact dist/ dans GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: lisiere-pwa-dist
          path: dist/
          retention-days: 90

      - name: Configurer Java 21 (Temurin) pour Android
        if: ${{ (github.event_name != 'workflow_dispatch' && vars.BUILD_ANDROID_PACKAGES != 'false') || inputs.build_android_packages == true }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accepter les licences Android SDK préinstallées
        if: ${{ (github.event_name != 'workflow_dispatch' && vars.BUILD_ANDROID_PACKAGES != 'false') || inputs.build_android_packages == true }}
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Installer Capacitor 8 Android & synchroniser dist/
        if: ${{ (github.event_name != 'workflow_dispatch' && vars.BUILD_ANDROID_PACKAGES != 'false') || inputs.build_android_packages == true }}
        run: |
          bun add -D @capacitor/cli@^8 @capacitor/android@^8
          ./node_modules/.bin/cap add android
          ./node_modules/.bin/cap sync android

      - name: Configurer Firebase Android (Google Sign-In & strings.xml / google-services.json)
        if: ${{ (github.event_name != 'workflow_dispatch' && vars.BUILD_ANDROID_PACKAGES != 'false') || inputs.build_android_packages == true }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          node -e '
            const fs = require("fs");

            // 1. Activer les dépendances Google Sign-In dans @capacitor-firebase/authentication
            const varsPath = "android/variables.gradle";
            let vars = fs.readFileSync(varsPath, "utf8");
            if (!vars.includes("rgcfaIncludeGoogle")) {
              vars = vars.replace("ext {", "ext {\n    rgcfaIncludeGoogle = true");
              fs.writeFileSync(varsPath, vars, "utf8");
            }

            // 2. Déployer google-services.json si fourni dans les secrets GitHub
            //    ou présent à la racine du dépôt, sinon injecter depuis firebase-applet-config.json
            const b64 = process.env.GOOGLE_SERVICES_JSON_BASE64 || "";
            if (b64.trim()) {
              fs.writeFileSync("android/app/google-services.json", Buffer.from(b64.trim(), "base64"));
              console.log("google-services.json injecté depuis le secret GitHub.");
            } else if (fs.existsSync("google-services.json")) {
              fs.copyFileSync("google-services.json", "android/app/google-services.json");
              console.log("google-services.json copié depuis la racine du dépôt vers android/app/google-services.json.");
            } else if (fs.existsSync("firebase-applet-config.json")) {
              const cfg = JSON.parse(fs.readFileSync("firebase-applet-config.json", "utf8"));
              const stringsPath = "android/app/src/main/res/values/strings.xml";
              let xml = fs.readFileSync(stringsPath, "utf8");
              const entries = [
                ["default_web_client_id", cfg.oAuthClientId || ""],
                ["google_app_id", cfg.appId || ""],
                ["google_api_key", cfg.apiKey || ""],
                ["gcm_defaultSenderId", cfg.messagingSenderId || ""],
                ["project_id", cfg.projectId || ""],
                ["google_storage_bucket", cfg.storageBucket || ""]
              ].filter(([, v]) => v);
              const additions = entries
                .filter(([k]) => !xml.includes(`name="${k}"`))
                .map(([k, v]) => `    <string name="${k}" translatable="false">${v}</string>`)
                .join("\n");
              if (additions) {
                xml = xml.replace("</resources>", `${additions}\n</resources>`);
                fs.writeFileSync(stringsPath, xml, "utf8");
              }
              console.log("Identifiants Firebase injectés dans strings.xml.");
            }
            // 3. Vérifier que le plugin google-services est présent dans Gradle si google-services.json existe
            if (fs.existsSync("android/app/google-services.json")) {
              const gs = JSON.parse(fs.readFileSync("android/app/google-services.json", "utf8"));
              const pkgs = (gs.client || []).map((c) => c.client_info?.android_client_info?.package_name).filter(Boolean);
              console.log("google-services.json packages:", pkgs.join(", "));
              const appGradlePath = "android/app/build.gradle";
              if (fs.existsSync(appGradlePath)) {
                let appGradle = fs.readFileSync(appGradlePath, "utf8");
                if (!appGradle.includes("com.google.gms.google-services")) {
                  appGradle += "\napply plugin: 'com.google.gms.google-services'\n";
                  fs.writeFileSync(appGradlePath, appGradle, "utf8");
                  console.log("Plugin com.google.gms.google-services ajouté à android/app/build.gradle.");
                }
              }
            }
          '

      - name: Cache Gradle
        if: ${{ (github.event_name != 'workflow_dispatch' && vars.BUILD_ANDROID_PACKAGES != 'false') || inputs.build_android_packages == true }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v8-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            gradle-v8-${{ runner.os }}-

      - name: Restaurer le keystore debug (SHA-1 stable)
        id: debug-keystore-cache
        if: ${{ (github.event_name != 'workflow_dispatch' && vars.BUILD_ANDROID_PACKAGES != 'false') || inputs.build_android_packages == true }}
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-lisiere-v1
          restore-keys: |
            gradle-v8-${{ runner.os }}-

      - name: Préparer la clé de signature debug (fixe)
        id: debug-keystore-setup
        if: ${{ (github.event_name != 'workflow_dispatch' && vars.BUILD_ANDROID_PACKAGES != 'false') || inputs.build_android_packages == true }}
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "source=secret" >> "$GITHUB_OUTPUT"
            echo "Clé debug restaurée depuis le secret ANDROID_DEBUG_KEYSTORE_BASE64."
          elif [ -f android-signing/debug.keystore ]; then
            cp -f android-signing/debug.keystore ~/.android/debug.keystore
            echo "source=repo" >> "$GITHUB_OUTPUT"
            echo "Clé debug copiée depuis android-signing/debug.keystore."
          elif [ -f ~/.android/debug.keystore ]; then
            echo "source=cache" >> "$GITHUB_OUTPUT"
            echo "Clé debug existante conservée depuis le cache GitHub Actions."
          else
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "source=generated" >> "$GITHUB_OUTPUT"
            echo "Nouvelle clé debug générée (sera sauvegardée immédiatement en cache)."
          fi

      - name: Sauvegarder le keystore debug en cache (SHA-1 persistante)
        if: ${{ ((github.event_name != 'workflow_dispatch' && vars.BUILD_ANDROID_PACKAGES != 'false') || inputs.build_android_packages == true) && steps.debug-keystore-cache.outputs.cache-hit != 'true' && (steps.debug-keystore-setup.outputs.source == 'cache' || steps.debug-keystore-setup.outputs.source == 'generated') }}
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-lisiere-v1

      - name: Ajouter un miroir Maven de secours & mémoire Gradle
        if: ${{ (github.event_name != 'workflow_dispatch' && vars.BUILD_ANDROID_PACKAGES != 'false') || inputs.build_android_packages == true }}
        run: |
          sed -i "s#mavenCentral()#maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }\n        mavenCentral()#g" android/build.gradle
          if [ -f android/gradle.properties ]; then
            sed -i 's/-Xmx[0-9]*m/-Xmx3072m/g' android/gradle.properties || true
          fi

      - name: Appliquer l'icône Lisière (sans doublon dans mipmap-anydpi-v26)
        if: ${{ (github.event_name != 'workflow_dispatch' && vars.BUILD_ANDROID_PACKAGES != 'false') || inputs.build_android_packages == true }}
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.png
          LAUNCHER_SRC="android-assets/ic_launcher.png"
          FOREGROUND_SRC="android-assets/ic_launcher_foreground.png"
          if [ ! -f "$LAUNCHER_SRC" ]; then
            LAUNCHER_SRC="public/pwa-512x512.png"
          fi
          if [ ! -f "$FOREGROUND_SRC" ]; then
            FOREGROUND_SRC="$LAUNCHER_SRC"
          fi
          if [ -f "$LAUNCHER_SRC" ]; then
            for dir in android/app/src/main/res/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}; do
              [ -d "$dir" ] || continue
              cp -f "$LAUNCHER_SRC" "$dir/ic_launcher.png"
              cp -f "$LAUNCHER_SRC" "$dir/ic_launcher_round.png"
              cp -f "$FOREGROUND_SRC" "$dir/ic_launcher_foreground.png"
            done
          fi
          BG_XML="android/app/src/main/res/values/ic_launcher_background.xml"
          if [ -f "$BG_XML" ]; then
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>\n' > "$BG_XML"
          fi

      - name: Compiler l'APK et l'AAB Android avec Gradle
        if: ${{ (github.event_name != 'workflow_dispatch' && vars.BUILD_ANDROID_PACKAGES != 'false') || inputs.build_android_packages == true }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          GRADLE_ARGS=(assembleDebug bundleDebug --no-daemon)
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            GRADLE_ARGS=(
              assembleRelease
              bundleRelease
              --no-daemon
              "-Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore"
              "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
            )
          fi
          for i in 1 2 3; do
            ./gradlew "${GRADLE_ARGS[@]}" && exit 0
            echo "Tentative $i échouée, nouvelle tentative dans 30 s..."
            sleep 30
          done
          exit 1

      - name: Préparer Lisiere-mobile.apk, Lisiere-mobile.aab et afficher l'empreinte SHA-1
        if: ${{ (github.event_name != 'workflow_dispatch' && vars.BUILD_ANDROID_PACKAGES != 'false') || inputs.build_android_packages == true }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          AAB_PATH=$(find android/app/build/outputs/bundle -name "*.aab" | head -n 1)
          cp "$APK_PATH" release-assets/Lisiere-mobile.apk
          cp "$AAB_PATH" release-assets/Lisiere-mobile.aab

          {
            echo "=== Empreintes de signature de l'APK (pour Firebase Console SHA-1 / SHA-256) ==="
            APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs release-assets/Lisiere-mobile.apk 2>&1 || true
            fi
            keytool -printcert -jarfile release-assets/Lisiere-mobile.apk 2>&1 | grep -E "SHA1:|SHA256:|SHA-1|SHA-256" || true
            if [ -f "$HOME/.android/debug.keystore" ]; then
              echo "--- Debug Keystore (~/.android/debug.keystore) ---"
              keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android 2>&1 | grep -E "SHA1:|SHA256:" || true
            fi
            echo "--- Vérification google-services.json & default_web_client_id ---"
            node -e '
              const fs = require("fs");
              const { execSync } = require("child_process");
              const gsPath = "android/app/google-services.json";
              let apkSha1 = "";
              try {
                const out = execSync("keytool -printcert -jarfile release-assets/Lisiere-mobile.apk", { encoding: "utf8" });
                const m = out.match(/SHA1:\s*([0-9A-Fa-f:]+)/);
                if (m) apkSha1 = m[1].replace(/:/g, "").toLowerCase();
              } catch {}
              if (!apkSha1) {
                try {
                  const apksigner = execSync("find \"${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools\" -name apksigner | sort -V | tail -n 1", { encoding: "utf8" }).trim();
                  if (apksigner) {
                    const out = execSync(`"${apksigner}" verify --print-certs release-assets/Lisiere-mobile.apk`, { encoding: "utf8" });
                    const m = out.match(/SHA-1 digest:\s*([0-9a-fA-F]+)/);
                    if (m) apkSha1 = m[1].toLowerCase();
                  }
                } catch {}
              }
              if (fs.existsSync(gsPath)) {
                const gs = JSON.parse(fs.readFileSync(gsPath, "utf8"));
                const hashes = [];
                for (const c of gs.client || []) {
                  for (const o of c.oauth_client || []) {
                    if (o.android_info?.certificate_hash) {
                      hashes.push(o.android_info.certificate_hash.toLowerCase());
                    }
                  }
                }
                console.log("APK SHA-1 (hex):", apkSha1 || "inconnu");
                console.log("google-services.json certificate_hash:", hashes.join(", ") || "aucun");
                if (apkSha1 && hashes.includes(apkSha1)) {
                  console.log("STATUT: OK — Empreinte SHA-1 de l APK conforme a google-services.json.");
                } else if (apkSha1) {
                  const colonSha1 = apkSha1.toUpperCase().match(/.{2}/g).join(":");
                  console.log(`STATUT: ATTENTION — Empreinte APK (${colonSha1}) absente de google-services.json. Ajoutez ${colonSha1} dans Firebase Console.`);
                }
              } else {
                console.log("google-services.json absent (mode strings.xml).");
              }
            '
          } | tee release-assets/apk-fingerprints.txt

          find release-assets -type f -empty -delete
          ls -lh release-assets/

      - name: Publier les artifacts APK et AAB dans GitHub Actions
        if: ${{ (github.event_name != 'workflow_dispatch' && vars.BUILD_ANDROID_PACKAGES != 'false') || inputs.build_android_packages == true }}
        uses: actions/upload-artifact@v4
        with:
          name: lisiere-android-packages
          path: |
            release-assets/Lisiere-mobile.apk
            release-assets/Lisiere-mobile.aab
            release-assets/apk-fingerprints.txt
          retention-days: 90

      - name: Créer/mettre à jour le brouillon de Release GitHub avec dist/, APK et AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('main-build-{0}', github.run_number) }}
          name: Lisière Build (${{ github.ref_name }} · #${{ github.run_number }})
          draft: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
          body: |
            Build automatique généré par GitHub Actions (`${{ github.sha }}`).

            Contenu inclus :
            - `lisiere-dist.zip` : build web PWA compilé (`dist/`)
            - `Lisiere-mobile.apk` : paquet Android installable directement (si activé)
            - `Lisiere-mobile.aab` : Android App Bundle pour Google Play (si activé)
            - `apk-fingerprints.txt` : empreintes SHA-1 / SHA-256 pour Firebase Console (si activé)
          files: release-assets/*
          generate_release_notes: true
